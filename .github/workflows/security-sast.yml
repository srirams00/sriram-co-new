name: Security SAST Quality Gate

on:
  push:
    branches: [main, silvest]
  pull_request:
    branches: [main]
  schedule:
    # Run every Monday at 04:00 UTC
    - cron: '0 4 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep-scan:
    name: Semgrep Static Security Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Semgrep with Custom & OWASP Rules
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            .semgrep/rules.yml
            p/owasp-top-ten
            p/security-audit
            p/javascript
            p/typescript
          generateSarif: "semgrep.sarif"

      - name: Upload Semgrep SARIF Report
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif

  dependency-audit:
    name: NPM Dependency Audit Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit Server Dependencies (High/Critical)
        run: npm audit --prefix server --audit-level=high

      - name: Audit Client Dependencies (High/Critical)
        run: npm audit --prefix client --audit-level=high
