services:
  - type: web
    name: sriram-and-co-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://review.sriramandco.in,https://sriram-co-new.vercel.app,http://localhost:3000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: SMTP_HOST
        value: smtppro.zoho.in
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        value: ramkumar@sriramandco.in
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        value: '"Sri Ram & Co" <ramkumar@sriramandco.in>'
